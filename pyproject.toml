[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "CCUID"
version = "1.1.0"
description = "通过 ACP 调用 Claude Code / Codex 等 coding agent 的 gsuid_core 插件"
authors = [{ name = "tyql688" }]
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11, <4.0"
dependencies = [
    "agent-client-protocol>=0.12.1,<0.13",
    "linkify-it-py>=2.1.1",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
]

[tool.ccuid.vendor]
katex = "0.18.4"
mermaid = "11.17.2"

[tool.pdm.build]
excludes = ["**/.DS_Store"]

[tool.pyright]
include = ["CCUID"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "../../.."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
